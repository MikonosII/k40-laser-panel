<text x="36" y="838" class="n" text-anchor="start">The beam can only fire when all three are true:</text>
<text x="36" y="857" class="n" text-anchor="start">• the front-panel Laser switch is on (L to G)</text>
<text x="36" y="876" class="n" text-anchor="start">• the stock lid + water loop is closed (P)</text>
<text x="36" y="895" class="n" text-anchor="start">• the SKR sends PWM above 0 on IN</text>
<text x="36" y="920" class="s" text-anchor="start">Never wire L to an SKR FAN or HE output: they float up to 24 V when off.</text>
<text x="24" y="958" class="s" text-anchor="start">Now: exhaust always on, air assist on its own switch. Kept for later: air assist relay on SKR HE0 (the panel's Air buttons switch it), spare FAN2 output.</text>
